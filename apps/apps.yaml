sunknee:
  module: sunknee_app
  class: SunKnee
  # Replace with your Sigenergy PV power sensor's entity_id -- check
  # Developer Tools > States in HA. Likely named after the integration's
  # "plant_sigen_photovoltaic_power" register (device "Sigen Plant"),
  # e.g. sensor.sigen_plant_photovoltaic_power -- but confirm the exact
  # entity_id rather than assuming.
  pv_power_entity: sensor.sigen_inverter_pv_power
  # Where DayCapture JSON exports land inside the AppDaemon container.
  export_dir: /config/apps/sunknee/data
  # Naive placeholder knee threshold (watts) -- see sunknee/naive_knee.py.
  knee_threshold_w: 10
  # sensor.sunknee_peak_power_today tracks the running max of a
  # percentile taken over a trailing window of readings -- rejects lone
  # spikes without ever falling as the day's power declines. Window is a
  # reading count, not a duration; tune it to roughly a few minutes based
  # on how often pv_power_entity actually updates.
  peak_percentile: 95
  peak_window: 40
  # sensor.sunknee_fit_peak_power_today cross-checks the above by fitting
  # a parabola to the smoothed daily curve and reading off its vertex.
  # Doesn't appear until there are at least this many readings *and* the
  # fit shows a genuine downward hump (not just a rising morning).
  fit_min_points: 30
