sunknee:
  module: sunknee_app
  class: SunKnee
  # Replace with your Sigenergy PV power sensor's entity_id -- check
  # Developer Tools > States in HA. Likely named after the integration's
  # "plant_sigen_photovoltaic_power" register (device "Sigen Plant"),
  # e.g. sensor.sigen_plant_photovoltaic_power -- but confirm the exact
  # entity_id rather than assuming.
  pv_power_entity: sensor.sigen_inverter_pv_power
  # Where DayCapture JSON exports land inside the AppDaemon container.
  export_dir: /config/apps/sunknee/data
  # Naive placeholder knee threshold (watts) -- see sunknee/naive_knee.py.
  knee_threshold_w: 10
  # sensor.sunknee_peak_power_today tracks the running max of a
  # percentile taken over a trailing window of readings -- rejects lone
  # spikes without ever falling as the day's power declines. Window is a
  # reading count, not a duration; tune it to roughly a few minutes based
  # on how often pv_power_entity actually updates.
  peak_percentile: 95
  peak_window: 40
  # sensor.sunknee_fit_peak_power_today cross-checks the above by fitting
  # a parabola to the smoothed daily curve and reading off its vertex.
  # Doesn't appear until there are at least this many readings *and* the
  # fit shows a genuine downward hump (not just a rising morning).
  fit_min_points: 30
  # Sanity ceiling for peak tracking/knee detection/the fit (NOT for the
  # stored capture file, which always keeps the raw reading either way).
  # Real over-nameplate output happens (cloud-edge irradiance
  # enhancement) but is modest, a few percent -- not a multiple. Set
  # from this site's known 7x400W ~= 2.8kW array: 4000W comfortably
  # clears the ~3040W cloud-edge-enhancement readings actually observed
  # (2026-08-17, 12:10-14:55) while catching the same day's later,
  # clearly-implausible 4260-5750W cluster (17:06-17:46, well past when
  # real output should be declining, not doubling). Adjust if your
  # array's rated capacity differs, or unset (omit this line) to disable.
  max_plausible_watts: 4000
  # Once daily (solcast_capture_time), snapshot Predbat's own
  # Solcast-derived forecast entities into that day's capture file, for
  # later comparison against what actually happened. Predbat pulls
  # Solcast directly (no separate ha-solcast-solar integration here), so
  # these are Predbat's own published entities, not a raw Solcast one --
  # check Developer Tools > States for the exact names if Predbat's
  # config differs. Either can be omitted; the job only runs if at
  # least one is set.
  solcast_today_entity: sensor.predbat_pv_today
  solcast_tomorrow_entity: sensor.predbat_pv_tomorrow
  solcast_capture_time: "00:05:00"
