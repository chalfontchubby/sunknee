[project]
name = "sunknee"
version = "0.1.0"
description = "Determine solar panel pose from power output"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sunknee-plot = "sunknee.diagnostics:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "appdaemon>=4.5",
]
diagnostics = [
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sunknee"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
